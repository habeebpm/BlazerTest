; GoldTrader settings.ini - the companion programs start.bat runs for you.
; Change enabled = true / false, save, then restart start.bat.
; Nothing here changes trading rules, lot size, SL or TP. A companion that
; fails never stops trading: it is restarted, or reported once over
; Telegram. Put "quotes" around a path with spaces.

[ml_retrain]
; Local ML advisor: retrains daily from your own closed trades (only once
; 30+ exist - until then it notes "not enough trades yet"). Seconds of CPU.
; Output: logs\ml_retrain.log
enabled = true
every_days = 1
args =

[calibration_report]
; How Claude's full/partial calls actually worked out.
; Output: logs\calibration_report.log
enabled = true
every_days = 7
args =

[scorecard]
; Weekly demo scorecard to your Telegram: both sources' real results with a
; plain verdict (TOO EARLY / NOT PROVEN YET / ON TRACK / STOP AND REVIEW).
; Output: logs\scorecard.log - or any time: python goldtrader.py scorecard
enabled = true
every_days = 7
args =

[relay_bridge]
; Telegram relay - how signals reach the EA: your own Telegram account copies
; the signal channel(s) into a private group you own, where your bot is admin
; (EA input InpChannelId1 = that group). Works for any channel you can read.
; Asked by the first-run questions (check.bat / settings.bat); one-time login:
; relay_login.bat. Only if your bot is admin of the signal channel itself may
; you set this to false.
enabled = true
; optional extras: --filter-signals  --accept-photo-captions
args =

[xtr_export]
; Python price export to Google Drive - only for a VPS WITHOUT Google Drive
; for Desktop. On a PC with Drive for Desktop the EA does it
; (InpXtrExport / InpXtrExportCopyTo) - leave this off.
enabled = false
args = --out-dir C:\XTR_Data --upload-drive --drive-folder-id YOUR_FOLDER_ID --drive-credentials C:\keys\drive.json
