; main_preset.ini - the other Python programs main.py can run for you.
; ML retraining and the conviction report are ON by default (nothing to
; set up); the relay bridge and the Python Drive export need your own ids,
; so they are OFF until you switch them on (the first-run questions do it
; for the relay). Change enabled = true/false, save, restart main.py. Nothing here changes trading rules, lots, SL or TP; a companion
; that fails never stops trading (it is restarted, or reported once over
; the Telegram alert). Put "quotes" around a path with spaces.

[relay_bridge]
; Telegram relay bridge - only for a signal channel you are NOT admin of
; (INSTALL step 7). Log in once first: python main.py --relay-login
; (--relay on the command line also turns this on.)
enabled = false
; optional extras: --filter-signals  --accept-photo-captions
args =

[xtr_export]
; Python price export to Google Drive - only for a VPS WITHOUT Google Drive
; for Desktop (INSTALL step 8 B). On a PC with Drive for Desktop the EA
; already does this (InpXtrExport) - leave this off.
enabled = false
args = --out-dir C:\XTR_Data --upload-drive --drive-folder-id YOUR_FOLDER_ID --drive-credentials C:\keys\drive.json

[ml_retrain]
; Retrain the local ML advisor (train_ml_model.py) from your own closed
; trades. It only trains once 30+ trades exist (until then it just notes
; "not enough trades yet"); daily, so the first model appears the day you
; get there. A few seconds of CPU. Output: logs\ml_retrain.log
enabled = true
every_days = 1
args =

[calibration_report]
; Conviction report (calibration_report.py): how Claude's full/partial
; calls actually worked out. Output: logs\calibration_report.log
enabled = true
every_days = 7
args =
